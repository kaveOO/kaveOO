name: Update .lastevent

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours, off the busy :00 mark
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/gen_readme.py]

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README
        run: python .github/gen_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git diff --quiet README.md && { echo "No new event."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -am "~ | Update .lastevent"
          git push

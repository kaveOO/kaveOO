name: Update README

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours, off the busy :00 mark
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/gen_readme.py, .github/gen_memory.py]

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README and memory window
        run: |
          python .github/gen_memory.py
          python .github/gen_readme.py
        env:
          # README_TOKEN (optional PAT) lets the calendar include private contributions
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git add README.md assets
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "~ | Update README data"
          git push
